function tone(f,d,t,v,w,f2){try{const x=AC,o=x.createOscillator(),g=x.createGain(),n=x.currentTime+(t||0);o.type=w||"sine";o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(v||.15,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(x.destination);o.start(n);o.stop(n+d+.02)}catch(e){}}

 if(P[k])P[k]()}
